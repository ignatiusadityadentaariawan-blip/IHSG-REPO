name: update-data
on:
schedule:
- cron: "*/30 2-8 * * 1-5"
- cron: "45 7 * * 1-5"
- cron: "40 9 * * 1-5"
workflow_dispatch: {}
permissions:
contents: read
pages: write
id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 40
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with: { python-version: "3.11" }
- run: pip install yfinance pandas numpy requests
- id: pages
uses: actions/configure-pages@v5
- uses: actions/cache/restore@v4
with: { path: data/cache, key: mkt-${{ github.run_id }}, restore-keys: mkt- }
- name: build data
run: python ihsg_lab/build_site.py
env: { SITE_URL: "${{ steps.pages.outputs.base_url }}" }
- uses: actions/cache/save@v4
with: { path: data/cache, key: mkt-${{ github.run_id }} }
- name: assemble site
run: |
mkdir -p _site/data/icache
cp index.html manifest.webmanifest sw.js icon-*.png _site/
cp -r data/.json data/.csv data/ohlc data/intra _site/data/ 2>/dev/null || true
cp data/cache/i/*.csv _site/data/icache/ 2>/dev/null || true
- uses: actions/upload-pages-artifact@v3
with: { path: _site }
deploy:
needs: build
runs-on: ubuntu-latest
environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
steps:
- id: d
uses: actions/deploy-pages@v4
